[project]
name = "gigacowork-logist-agent"
version = "1.1.1"
description = "Навык GigaCowork: распределение новых ФУЛ между логистами и строки реестра Cloud"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.17.4",
    "markdown>=3.5",
]

# ------------------------------------------------------------------ ruff

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["dist", "runs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # длину строк держит форматтер; длинные русские строки-сообщения не переносим
    "RUF001",   # кириллица в строках — это норма для русскоязычного продукта
    "RUF002",   # то же в докстрингах
    "RUF003",   # то же в комментариях
]

[tool.ruff.lint.isort]
known-first-party = ["distribute", "engine", "normalize", "report", "xlreader", "evaluate", "import_harness_runs"]
# tests/helpers.py настраивает sys.path, поэтому в тестах он всегда импортируется раньше модулей навыка
section-order = ["future", "standard-library", "third-party", "test-helpers", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"test-helpers" = ["helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]                 # helpers настраивает sys.path до импорта модулей навыка
"agent/skill/*/scripts/distribute.py" = ["E402"]
"tools/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------------ pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: сквозные проверки с запуском скрипта навыка на наборах данных (медленнее)",
]

[tool.coverage.run]
# покрытие считаем по ядру: скрипты навыка и метрики приёмки;
# служебные tools/* проверяются в CI запуском (контрольные прогоны, сборка архивов)
source = ["agent/skill/logist-distribution/scripts", "tools"]
omit = [
    "tools/build.py",
    "tools/build_report.py",
    "tools/gigachat_agent.py",
    "tools/import_harness_runs.py",
    "tools/run_control.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
